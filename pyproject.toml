[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalrank-mcp"
version = "0.1.0"
description = "MCP interface for SignalRank retrieval, counter-evidence, and evidence ledgers."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Bharath Sampadi" }
]
dependencies = [
  "httpx>=0.28,<1",
  "mcp[cli]>=2,<3",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.16,<1",
  "pyright>=1.1.411",
]

[project.scripts]
signalrank-mcp = "signalrank_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
